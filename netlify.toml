[build]
  command = "pnpm build"
  publish = "build"

# Netlify doesn't read mise.toml, so keep this in sync with it.
[build.environment]
  NODE_VERSION = "24.21.0"

# URLs the old Hugo blog generated that don't exist anymore.
[[redirects]]
  from = "/blog/sitemap.xml"
  to = "/sitemap-index.xml"

[[redirects]]
  from = "/blog/posts/index.xml"
  to = "/blog/index.xml"

[[redirects]]
  from = "/blog/tags/index.xml"
  to = "/blog/index.xml"

[[redirects]]
  from = "/blog/tags/*/index.xml"
  to = "/blog/index.xml"

[[redirects]]
  from = "/blog/page/*"
  to = "/blog/"
